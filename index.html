<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b2f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alan Feliz">
  <meta name="description" content="Alan Feliz: ajude o Alan a escapar dos zumbis no Edifício Sede III. Jogo em pixel art para celular.">
  <title>Alan Feliz</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1b1b2f;
      --ink: #fdf6e3;
      --accent: #ffd23f;
      --red: #e63946;
      --font: "Press Start 2P", ui-monospace, monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
    }
    #stage { position: relative; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud {
      position: absolute;
      left: 0; right: 0; top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 8px) 10px 8px;
      font-size: clamp(9px, 2.8vw, 13px);
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }
    .hud[hidden], #pause[hidden] { display: none; }
    .hud .hearts { color: var(--red); letter-spacing: 2px; }
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: rgba(10, 10, 25, .82);
    }
    .screen[hidden] { display: none; }
    .screen h1 {
      margin: 0;
      font-size: clamp(26px, 9vw, 40px);
      line-height: 1.25;
      color: var(--accent);
      text-shadow: 3px 3px 0 var(--red), 6px 6px 0 #000;
    }
    .screen h2 { margin: 0; font-size: clamp(16px, 5vw, 22px); color: var(--red); text-shadow: 2px 2px 0 #000; }
    .screen p { margin: 0; font-size: clamp(9px, 2.8vw, 12px); line-height: 1.8; }
    .screen .small { opacity: .75; font-size: clamp(8px, 2.4vw, 10px); }
    .screen canvas.hero { width: 96px; height: 144px; }
    button {
      font-family: var(--font);
      font-size: clamp(12px, 3.6vw, 15px);
      color: #1b1b2f;
      background: var(--accent);
      border: 0;
      padding: 14px 22px;
      box-shadow: 0 4px 0 #b8860b, 4px 8px 0 #000;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: translateY(4px); box-shadow: 0 0 0 #b8860b, 4px 4px 0 #000; }
    .banner {
      position: absolute;
      left: 0; right: 0; top: 38%;
      text-align: center;
      font-size: clamp(16px, 5.5vw, 24px);
      color: var(--accent);
      text-shadow: 3px 3px 0 #000;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
    }
    .banner.show { opacity: 1; }
    #pause {
      position: absolute;
      right: 10px;
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      padding: 8px 10px;
      font-size: 11px;
      box-shadow: 0 3px 0 #b8860b, 3px 6px 0 #000;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="144" height="256"></canvas>
    <div class="hud" id="hud" hidden>
      <span class="hearts" id="hearts"></span>
      <span id="floor">ANDAR 1</span>
      <span id="score">0</span>
    </div>
    <div class="banner" id="banner"></div>
    <button id="pause" hidden aria-label="Pausar">II</button>

    <div class="screen" id="menu">
      <h1>ALAN<br>FELIZ</h1>
      <canvas class="hero" id="heroPreview" width="8" height="12"></canvas>
      <p>O Alan está no<br>Edifício Sede III<br>e os zumbis petistas<br>invadiram o prédio!</p>
      <p class="small">Arraste o dedo para andar.<br>Pegue os cafés ☕ e sobreviva<br>o máximo de andares.</p>
      <button id="play">JOGAR</button>
      <p class="small" id="bestMenu"></p>
    </div>

    <div class="screen" id="paused" hidden>
      <h2>PAUSADO</h2>
      <button id="resume">CONTINUAR</button>
    </div>

    <div class="screen" id="over" hidden>
      <h2>PEGARAM O ALAN!</h2>
      <p id="final"></p>
      <button id="again">JOGAR DE NOVO</button>
      <p class="small">Mas o Alan continua feliz :)</p>
    </div>
  </div>

  <script>
  (() => {
    const W = 144, H = 256, TOP = 28; // TOP = parede com janelas
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const stage = document.getElementById('stage');
    const $ = id => document.getElementById(id);

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} }
    };

    // ---------- tela ----------
    function fit() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const s = Math.min(vw / W, vh / H);
      stage.style.width = Math.floor(W * s) + 'px';
      stage.style.height = Math.floor(H * s) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();

    // ---------- sprites (pixel art) ----------
    const PAL = {
      H: '#3b2414', S: '#f1c27d', E: '#1a1a1a', M: '#7a2e1f', R: '#e63946', r: '#a4161a',
      B: '#264b96', K: '#222', G: '#8bc34a', g: '#558b2f', W: '#fff59d', Y: '#ffd23f',
      P: '#4a4e69', C: '#fafafa', c: '#6d4c41', X: '#ff5252'
    };
    const ALAN = [
      [
        '..HHHH..',
        '.HHHHHH.',
        '.HSSSSH.',
        '.SESSES.',
        '.SSSSSS.',
        '.SMSSMS.',
        '..SMMS..',
        '.RRRRRR.',
        'RRRrrRRR',
        'SRRRRRRS',
        '.BBBBBB.',
        '.KK..KK.'
      ],
      [
        '..HHHH..',
        '.HHHHHH.',
        '.HSSSSH.',
        '.SESSES.',
        '.SSSSSS.',
        '.SMSSMS.',
        '..SMMS..',
        '.RRRRRR.',
        'RRRrrRRR',
        'SRRRRRRS',
        '.BBBBBB.',
        '..KK.KK.'
      ]
    ];
    const ZOMBIE = [
      [
        '..gggg..',
        '.gGGGGg.',
        '.GXGGXG.',
        '.GGGGGG.',
        '.GgggGG.',
        '..GGGG..',
        'GRRRRRRG',
        '.RRYRRR.',
        '.RYYYRR.',
        '.PPPPPP.',
        '.PP..PP.',
        '.KK..KK.'
      ],
      [
        '..gggg..',
        '.gGGGGg.',
        '.GXGGXG.',
        '.GGGGGG.',
        '.GGgggG.',
        '..GGGG..',
        'GRRRRRRG',
        '.RRYRRR.',
        '.RYYYRR.',
        '.PPPPPP.',
        '.PP..PP.',
        '..KK.KK.'
      ]
    ];
    const COFFEE = [
      '.c.c..',
      '..c.c.',
      'CCCCC.',
      'CccCCC',
      'CccCC.',
      '.CCC..'
    ];

    function makeSprite(rows, flip = false) {
      const c = document.createElement('canvas');
      c.width = rows[0].length; c.height = rows.length;
      const x = c.getContext('2d');
      rows.forEach((row, y) => [...row].forEach((ch, i) => {
        if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(flip ? c.width - 1 - i : i, y, 1, 1); }
      }));
      return c;
    }
    const sprAlan = ALAN.map(f => [makeSprite(f), makeSprite(f, true)]);
    const sprZombie = ZOMBIE.map(f => [makeSprite(f), makeSprite(f, true)]);
    const sprCoffee = makeSprite(COFFEE);

    // prévia do herói no menu
    $('heroPreview').getContext('2d').drawImage(sprAlan[0][0], 0, 0);
    $('heroPreview').style.imageRendering = 'pixelated';

    // ---------- cenário (pré-renderizado) ----------
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;
    (() => {
      const b = bg.getContext('2d');
      // carpete
      for (let y = TOP; y < H; y += 8) for (let x = 0; x < W; x += 8) {
        b.fillStyle = ((x + y) / 8) % 2 ? '#5c6378' : '#565d71';
        b.fillRect(x, y, 8, 8);
      }
      // parede
      b.fillStyle = '#2b2d42'; b.fillRect(0, 0, W, TOP);
      b.fillStyle = '#8d99ae'; b.fillRect(0, TOP - 3, W, 3);
      // janelas com vista da cidade
      for (let x = 6; x < W - 10; x += 34) {
        b.fillStyle = '#9ad1ff'; b.fillRect(x, 6, 26, 15);
        b.fillStyle = '#6fa8dc'; b.fillRect(x, 15, 26, 6);
        b.fillStyle = '#3d5a80';
        b.fillRect(x + 2, 12, 4, 9); b.fillRect(x + 9, 9, 5, 12); b.fillRect(x + 17, 13, 6, 8);
        b.fillStyle = '#edf2f4'; b.fillRect(x + 12, 6, 2, 15); b.fillRect(x, 13, 26, 1);
      }
      // plantas nos cantos
      const plant = (x, y) => {
        b.fillStyle = '#795548'; b.fillRect(x + 1, y + 6, 6, 4);
        b.fillStyle = '#2e7d32'; b.fillRect(x, y, 8, 6);
        b.fillStyle = '#43a047'; b.fillRect(x + 2, y - 2, 4, 4);
      };
      plant(3, TOP + 4); plant(W - 11, TOP + 4); plant(3, H - 14); plant(W - 11, H - 14);
      // elevadores (por onde os zumbis entram)
      b.fillStyle = '#b0b7c3';
      b.fillRect(W / 2 - 10, H - 4, 20, 4);
      b.fillRect(0, H / 2 - 10, 3, 20); b.fillRect(W - 3, H / 2 - 10, 3, 20);
    })();

    // ---------- estado ----------
    let state = 'menu', last = 0, best = +store.get('alan-best') || 0;
    let alan, zombies, coffees, score, time, floor, lives, inv, boost, spawnT, coffeeT, frameT, shake;
    $('bestMenu').textContent = best ? `RECORDE: ${best}` : '';

    function reset() {
      alan = { x: W / 2, y: H / 2 + 20, dir: 0, moving: false };
      zombies = []; coffees = [];
      score = 0; time = 0; floor = 1; lives = 3; inv = 0; boost = 0;
      spawnT = 1.2; coffeeT = 4; frameT = 0; shake = 0;
      updateHud();
    }

    function updateHud() {
      $('hearts').textContent = '♥'.repeat(lives) + '♡'.repeat(Math.max(0, 3 - lives));
      $('floor').textContent = 'ANDAR ' + floor;
      $('score').textContent = Math.floor(score);
    }

    let bannerT;
    function banner(text) {
      const b = $('banner');
      b.textContent = text;
      b.classList.add('show');
      clearTimeout(bannerT);
      bannerT = setTimeout(() => b.classList.remove('show'), 1400);
    }

    function spawnZombie() {
      const side = Math.random() * 4 | 0;
      let x, y;
      if (side === 0) { x = W / 2 + (Math.random() - .5) * 16; y = H + 12; }          // elevador de baixo
      else if (side === 1) { x = -10; y = H / 2 + (Math.random() - .5) * 16; }        // elevador esquerdo
      else if (side === 2) { x = W + 10; y = H / 2 + (Math.random() - .5) * 16; }     // elevador direito
      else { x = 12 + Math.random() * (W - 24); y = TOP - 4; }                        // escada de cima
      const speed = 14 + floor * 2.5 + Math.random() * 8;
      zombies.push({ x, y, speed, dir: 0, wob: Math.random() * 6, anim: Math.random() });
    }

    function spawnCoffee() {
      if (coffees.length >= 2) return;
      coffees.push({ x: 14 + Math.random() * (W - 28), y: TOP + 18 + Math.random() * (H - TOP - 36), t: 8 });
    }

    // ---------- controles ----------
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.startsWith('Arrow')) e.preventDefault();
      if ((e.key === 'Escape' || e.key === 'p') && (state === 'play' || state === 'pause')) togglePause();
    });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // joystick virtual: toque em qualquer lugar e arraste
    const stick = { active: false, ox: 0, oy: 0, dx: 0, dy: 0, id: null };
    const toLocal = (cx, cy) => {
      const r = canvas.getBoundingClientRect();
      return [(cx - r.left) / r.width * W, (cy - r.top) / r.height * H];
    };
    canvas.addEventListener('pointerdown', e => {
      if (state !== 'play') return;
      stick.active = true; stick.id = e.pointerId;
      [stick.ox, stick.oy] = toLocal(e.clientX, e.clientY);
      stick.dx = stick.dy = 0;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => {
      if (!stick.active || e.pointerId !== stick.id) return;
      const [x, y] = toLocal(e.clientX, e.clientY);
      stick.dx = x - stick.ox; stick.dy = y - stick.oy;
      const max = 18, d = Math.hypot(stick.dx, stick.dy);
      if (d > max) { // origem acompanha o dedo, como nos jogos de celular
        stick.ox = x - stick.dx / d * max; stick.oy = y - stick.dy / d * max;
        stick.dx = x - stick.ox; stick.dy = y - stick.oy;
      }
    });
    const endStick = e => { if (e.pointerId === stick.id) { stick.active = false; stick.dx = stick.dy = 0; } };
    canvas.addEventListener('pointerup', endStick);
    canvas.addEventListener('pointercancel', endStick);
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    function inputVector() {
      let x = 0, y = 0;
      if (keys.arrowleft || keys.a) x -= 1;
      if (keys.arrowright || keys.d) x += 1;
      if (keys.arrowup || keys.w) y -= 1;
      if (keys.arrowdown || keys.s) y += 1;
      if (stick.active) {
        const d = Math.hypot(stick.dx, stick.dy);
        if (d > 2) { x = stick.dx / 18; y = stick.dy / 18; }
      }
      const m = Math.hypot(x, y);
      return m > 1 ? [x / m, y / m] : [x, y];
    }

    // ---------- loop ----------
    function update(dt) {
      time += dt;
      frameT += dt;
      score += dt * 10;
      inv = Math.max(0, inv - dt);
      boost = Math.max(0, boost - dt);
      shake = Math.max(0, shake - dt);

      const newFloor = 1 + Math.floor(time / 20);
      if (newFloor !== floor) { floor = newFloor; banner('ANDAR ' + floor + '!'); score += 100; }

      // Alan
      const [ix, iy] = inputVector();
      const sp = boost ? 85 : 58;
      alan.x = Math.max(8, Math.min(W - 8, alan.x + ix * sp * dt));
      alan.y = Math.max(TOP + 8, Math.min(H - 12, alan.y + iy * sp * dt));
      alan.moving = Math.abs(ix) + Math.abs(iy) > 0.05;
      if (ix < -0.1) alan.dir = 1; else if (ix > 0.1) alan.dir = 0;

      // zumbis
      spawnT -= dt;
      if (spawnT <= 0 && zombies.length < 45) {
        spawnZombie();
        spawnT = Math.max(0.3, 1.5 - floor * 0.13) * (0.7 + Math.random() * 0.6);
      }
      for (const z of zombies) {
        const dx = alan.x - z.x, dy = alan.y - z.y, d = Math.hypot(dx, dy) || 1;
        z.wob += dt * 3;
        const wx = Math.cos(z.wob) * 0.35, wy = Math.sin(z.wob * 1.3) * 0.35;
        z.x += (dx / d + wx) * z.speed * dt;
        z.y += (dy / d + wy) * z.speed * dt;
        z.dir = dx < 0 ? 1 : 0;
        z.anim += dt;
      }
      // zumbis se empurram para não virarem um bolo só
      for (let i = 0; i < zombies.length; i++) for (let j = i + 1; j < zombies.length; j++) {
        const a = zombies[i], b = zombies[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < 12) {
          const p = (12 - d) / 2 / d;
          a.x -= dx * p; a.y -= dy * p; b.x += dx * p; b.y += dy * p;
        }
      }

      // colisão com zumbi
      if (!inv) {
        for (const z of zombies) {
          if (Math.abs(z.x - alan.x) < 9 && Math.abs(z.y - alan.y) < 14) {
            lives--;
            inv = 1.6; shake = 0.3;
            if (navigator.vibrate) navigator.vibrate(120);
            // afasta os zumbis próximos para dar uma chance
            zombies = zombies.filter(o => Math.hypot(o.x - alan.x, o.y - alan.y) > 40);
            if (lives <= 0) return gameOver();
            banner('AI!');
            break;
          }
        }
      }

      // cafés
      coffeeT -= dt;
      if (coffeeT <= 0) { spawnCoffee(); coffeeT = 6 + Math.random() * 5; }
      coffees = coffees.filter(c => {
        c.t -= dt;
        if (Math.abs(c.x - alan.x) < 12 && Math.abs(c.y - alan.y) < 15) {
          score += 50; boost = 3;
          banner('CAFÉ! +50');
          if (navigator.vibrate) navigator.vibrate(20);
          return false;
        }
        return c.t > 0;
      });

      updateHud();
    }

    function drawSprite(frames, x, y, anim, dir) {
      const f = frames[Math.floor(anim * 6) % 2][dir];
      ctx.drawImage(f, Math.round(x - 8), Math.round(y - 12), 16, 24);
    }

    function render() {
      ctx.save();
      if (shake) ctx.translate((Math.random() - .5) * 4, (Math.random() - .5) * 4);
      ctx.drawImage(bg, 0, 0);

      // cafés (piscam quando vão sumir)
      for (const c of coffees) {
        if (c.t < 2 && Math.floor(c.t * 8) % 2) continue;
        ctx.drawImage(sprCoffee, Math.round(c.x - 6), Math.round(c.y - 6 + Math.sin(time * 4) * 1), 12, 12);
      }

      // desenha por ordem de profundidade
      const actors = zombies.map(z => ({ y: z.y, draw: () => {
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(Math.round(z.x - 6), Math.round(z.y + 10), 12, 3);
        drawSprite(sprZombie, z.x, z.y, z.anim, z.dir);
      } }));
      actors.push({ y: alan.y, draw: () => {
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(Math.round(alan.x - 6), Math.round(alan.y + 10), 12, 3);
        if (inv && Math.floor(inv * 12) % 2) return;
        if (boost) { ctx.fillStyle = 'rgba(255,210,63,.35)'; ctx.fillRect(Math.round(alan.x - 10), Math.round(alan.y - 14), 20, 28); }
        drawSprite(sprAlan, alan.x, alan.y, alan.moving ? frameT : 0, alan.dir);
      } });
      actors.sort((a, b) => a.y - b.y).forEach(a => a.draw());

      // joystick
      if (stick.active && state === 'play') {
        ctx.globalAlpha = .35;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 18, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .6;
        ctx.beginPath(); ctx.arc(stick.ox + stick.dx, stick.oy + stick.dy, 7, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    function loop(t) {
      const dt = Math.min(0.05, (t - last) / 1000 || 0);
      last = t;
      if (state === 'play') update(dt);
      render();
      requestAnimationFrame(loop);
    }

    // ---------- telas ----------
    function show(id) {
      ['menu', 'paused', 'over'].forEach(s => { $(s).hidden = s !== id; });
      const playing = id === null;
      $('hud').hidden = !playing && state !== 'pause';
      $('pause').hidden = !playing;
    }

    function startGame() {
      reset();
      state = 'play';
      show(null);
      banner('ANDAR 1');
    }

    function gameOver() {
      state = 'over';
      const s = Math.floor(score);
      const record = s > best;
      if (record) { best = s; store.set('alan-best', best); }
      $('final').innerHTML = `PONTOS: ${s}<br>ANDAR: ${floor}<br>${record ? 'NOVO RECORDE!' : 'RECORDE: ' + best}`;
      $('bestMenu').textContent = `RECORDE: ${best}`;
      $('hud').hidden = false;
      show('over');
      $('pause').hidden = true;
    }

    function togglePause() {
      if (state === 'play') { state = 'pause'; show('paused'); $('hud').hidden = false; }
      else if (state === 'pause') { state = 'play'; show(null); }
    }

    $('play').addEventListener('click', startGame);
    $('again').addEventListener('click', startGame);
    $('resume').addEventListener('click', togglePause);
    $('pause').addEventListener('click', togglePause);
    document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

    // menu de fundo: alguns zumbis passeando
    reset();
    for (let i = 0; i < 6; i++) spawnZombie();
    requestAnimationFrame(loop);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  })();
  </script>
</body>
</html>
